<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마을 이야기 최종 보고서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.js"></script>
<style>
  :root{
    --bg: #faf6ee;
    --card: #ffffff;
    --card-line: #e6ddc9;
    --amber: #c9822c;
    --amber-soft: #f3e3c8;
    --text: #2c2620;
    --muted: #8a8071;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #fffdf8 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    padding:34px 28px 70px;
  }
  .wrap{max-width:780px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:26px;}
  .title-block .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--amber);font-weight:800;margin-bottom:6px;}
  .title-block h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-0.01em;}
  .title-block .sub{color:var(--muted);font-size:13.5px;margin-top:6px;}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .topic-toggle{display:flex;background:var(--card);border:1px solid var(--card-line);border-radius:999px;padding:5px;}
  .topic-toggle button{
    padding:10px 22px;border:none;background:transparent;color:var(--muted);
    font-weight:700;font-size:15px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .topic-toggle button.active{background:var(--amber);color:#fffaf0;}

  .refresh{
    background:var(--card);border:1px solid var(--card-line);
    color:var(--text);font-weight:700;font-size:13.5px;
    padding:10px 18px;border-radius:999px;cursor:pointer;
  }
  .refresh:hover{border-color:var(--amber);}

  .panel{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:22px;
    padding:26px 26px 30px;
    box-shadow:0 1px 3px rgba(60,50,30,0.05);
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-head h2{font-size:19px;margin:0;font-weight:800;}
  .panel-count{font-size:12.5px;color:var(--muted);font-weight:600;}

  canvas.cloud{width:100%;height:380px;display:block;}

  .cat-bars{margin-top:20px;display:flex;flex-direction:column;gap:8px;}
  .cat-bar-row{display:grid;grid-template-columns:170px 1fr 34px;align-items:center;gap:10px;font-size:12.5px;}
  .cat-bar-label{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat-bar-track{background:var(--amber-soft);border-radius:999px;height:9px;overflow:hidden;}
  .cat-bar-fill{background:var(--amber);height:100%;border-radius:999px;}
  .cat-bar-num{text-align:right;color:var(--text);font-weight:700;}

  .top-words{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;}
  .top-word-chip{
    font-size:12px;font-weight:700;
    background:var(--amber-soft);color:#7a4e18;
    padding:5px 11px;border-radius:999px;
  }

  .section-label{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:22px 0 8px;}

  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:60px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <div class="eyebrow">FINAL REPORT</div>
      <h1>마을 이야기 최종 보고서</h1>
      <div class="sub">모두의 골목 아트페스타 원도심 문화원탁</div>
    </div>
    <div class="controls">
      <div class="topic-toggle">
        <button data-topic="주제1" class="active">주제 1</button>
        <button data-topic="주제2">주제 2</button>
      </div>
      <button class="refresh" id="refreshBtn">새로고침</button>
    </div>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">주제 1</h2>
      <div class="panel-count" id="panelCount"></div>
    </div>
    <canvas class="cloud" id="cloud" width="700" height="380"></canvas>
    <div id="emptyNote" class="empty-note" style="display:none;">아직 데이터가 없습니다.</div>
    <div class="top-words" id="topWords"></div>
    <div class="section-label">카테고리별 참여 건수</div>
    <div class="cat-bars" id="catBars"></div>
  </div>
</div>

<script>
  // ⚠️ 배포한 Apps Script 웹앱 URL을 여기에 붙여넣으세요
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx13xoebmkwHY2tw60618-zHTnVgmsJswGwOq9XqgkS2EXXc1I8yDCwU4xdZcZNbuIknA/exec";

  const CATEGORY_ORDER = [
    '추억하는 마을 (역사, 전시, 기록)',
    '신나는 마을 (공연, 낭송회)',
    '즐기는 마을 (놀이, 체험)',
    '맛있는 마을 (먹거리, 특산물)',
    '쉼이있는 마을 (마을해설, 원도심투어)',
    '나눔하는 마을 (벼룩시장, 아나바다)',
    '기타'
  ];

  // 워드클라우드에서 제외할 조사/접속어/의미 약한 단어
  const STOPWORDS = new Set([
    '그리고','그래서','그러나','하지만','그런데','정말','너무','진짜','그냥',
    '저는','제가','우리','저희','같아요','같습니다','너무나','정말로','조금',
    '많이','아주','매우','또한','하고','있는','있었','했다','한다','합니다',
    '했어요','있어요','것','거','수','때','등','좀','더','또'
  ]);

  // 단어 끝에 붙은 흔한 한국어 조사를 제거 (완벽하지 않은 간이 규칙)
  const PARTICLE_RE = /(으로|에서|에게|한테|까지|부터|보다|처럼|같이|이라서|이지만|는데|이다|입니다|해요|했어요|합니다|은|는|이|가|을|를|에|와|과|도|만|의|로|들)$/;

  let currentTopic = '주제1';

  function stripParticle(word){
    let w = word;
    for(let i=0;i<2;i++){
      const stripped = w.replace(PARTICLE_RE, '');
      if(stripped.length >= 2 && stripped !== w){
        w = stripped;
      } else {
        break;
      }
    }
    return w;
  }

  function tokenize(text){
    if(!text) return [];
    const cleaned = text.replace(/[.,!?~^()\[\]"'\-–—:;/\\]/g, ' ');
    return cleaned.split(/\s+/)
      .map(w => w.trim())
      .filter(w => w.length >= 2)
      .map(stripParticle)
      .filter(w => w.length >= 2 && !STOPWORDS.has(w));
  }

  function buildWordFrequency(items){
    const freq = {};
    items.forEach(item => {
      // 제목은 핵심어일 가능성이 높아 2배 가중치를 줌
      const titleWords = tokenize(item.title);
      const contentWords = tokenize(item.content);
      [...titleWords, ...titleWords, ...contentWords].forEach(w => {
        freq[w] = (freq[w] || 0) + 1;
      });
    });
    return Object.entries(freq).sort((a,b) => b[1]-a[1]);
  }

  function renderCloud(canvas, wordList){
    // 캔버스를 비워서 이전 주제의 잔상이 남지 않게 함
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!wordList.length) return;

    const maxCount = wordList[0][1];
    WordCloud(canvas, {
      list: wordList.slice(0, 90),
      gridSize: 9,
      weightFactor: (size) => 12 + (size / maxCount) * 52,
      fontFamily: "'Pretendard', sans-serif",
      color: () => {
        const palette = ['#c9822c', '#a563b0', '#3f7fb0', '#3f9c6d', '#c1507a', '#c06a35'];
        return palette[Math.floor(Math.random()*palette.length)];
      },
      backgroundColor: 'transparent',
      rotateRatio: 0.15,
      rotationSteps: 2,
      shrinkToFit: true,
      drawOutOfBound: false
    });
  }

  function renderTopWordChips(container, wordList){
    container.innerHTML = '';
    wordList.slice(0, 10).forEach(([word, count]) => {
      const chip = document.createElement('span');
      chip.className = 'top-word-chip';
      chip.textContent = `${word} · ${count}`;
      container.appendChild(chip);
    });
  }

  function renderCategoryBars(container, items){
    const counts = {};
    CATEGORY_ORDER.forEach(c => counts[c] = 0);
    items.forEach(item => {
      if(counts[item.category] !== undefined){
        counts[item.category]++;
      } else {
        counts['기타'] = (counts['기타'] || 0) + 1;
      }
    });
    const max = Math.max(1, ...Object.values(counts));
    container.innerHTML = '';
    CATEGORY_ORDER.forEach(cat => {
      const count = counts[cat] || 0;
      const row = document.createElement('div');
      row.className = 'cat-bar-row';
      row.innerHTML = `
        <div class="cat-bar-label">${cat}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(count/max*100)}%"></div></div>
        <div class="cat-bar-num">${count}</div>
      `;
      container.appendChild(row);
    });
  }

  async function loadTopic(){
    const canvas = document.getElementById('cloud');
    const countEl = document.getElementById('panelCount');
    const emptyEl = document.getElementById('emptyNote');
    const chipsEl = document.getElementById('topWords');
    const barsEl = document.getElementById('catBars');
    const titleEl = document.getElementById('panelTitle');

    titleEl.textContent = currentTopic === '주제1' ? '주제 1' : '주제 2';

    try {
      const res = await fetch(`${SCRIPT_URL}?topic=${encodeURIComponent(currentTopic)}`);
      const data = await res.json();
      if(data.result !== 'success'){ return; }

      const items = data.items || [];
      countEl.textContent = `${items.length}건`;

      if(items.length === 0){
        emptyEl.style.display = 'block';
        chipsEl.innerHTML = '';
        renderCategoryBars(barsEl, []);
        renderCloud(canvas, []);
        return;
      }
      emptyEl.style.display = 'none';

      const wordList = buildWordFrequency(items);
      renderCloud(canvas, wordList);
      renderTopWordChips(chipsEl, wordList);
      renderCategoryBars(barsEl, items);

    } catch(err){
      console.error('보고서 데이터를 불러오지 못했습니다', err);
    }
  }

  document.querySelectorAll('.topic-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.topic-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTopic = btn.dataset.topic;
      loadTopic();
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', loadTopic);
  loadTopic();
</script>
</body>
</html>
